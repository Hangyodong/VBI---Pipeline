# =============================================================================
# wc_vbi.yaml  —  cuBNM model matching VBI's WC_EIB equations exactly (WCVBI)
# =============================================================================
# Schema = upstream cuBNM v0.1.0 codegen (codegen/recipes/*.yaml + model_specs.py).
#
# Difference vs stock WC: every VBI WC_EIB knob is a regional_param (settable
# from Python) instead of a compile-time constant, and the inhibitory
# population gets an FFI global-input gate (-g_i*lamda*globalinput):
#   - sigmoid gain alpha_E/alpha_I, threshold theta_E/theta_I  (stock: a/mu const)
#   - refractory (k - r*E), output scale c_e/c_i, time const tau_E/tau_I
#   - g_i (FFI gate), lamda (FFI scale)
#   - c_ei = I->E inhibition (inferred), c_ie = E->I excitation
# globalinput = SC @ conn_state (= W @ E); G = inferred g_e (global coupling).
# No [0,1] clip — VBI does not clip; (k - r*E) bounds the state naturally.
# =============================================================================

model_name: WCVBI
full_name: Wilson-Cowan (VBI WC_EIB equivalent)
citations:
  - VBI WC_EIB (simulation/wc_eib.py)

latex_equations: |
    \tau^E\dot{E_i} = -E + (k_e - r_e E) S^E[c_{ee} E_i - c_{ei} I_i + G \sum_j C_{ij} E_j + P^E]
    \tau^I\dot{I_i} = -I + (k_i - r_i I) S^I[c_{ie} E_i - c_{ii} I_i - g_i \lambda \sum_j C_{ij} E_j + P^I]
    S^E(x) = c_e / (1 + e^{-\alpha_E (x - \theta_E)})
    S^I(x) = c_i / (1 + e^{-\alpha_I (x - \theta_I)})

init_equations: |
  E = 0.001
  I = 0.001

step_equations: |
  # Sigmoid activations (gain alpha, threshold theta, output scale c)
  S_E = c_e / (1.0 + exp(-alpha_E * (c_ee * E - c_ei * I + G * globalinput + P_E - theta_E)))
  S_I = c_i / (1.0 + exp(-alpha_I * (c_ie * E - c_ii * I - g_i * lamda * globalinput + P_I - theta_I)))

  # Derivatives (divide by tau so tau stays a regional param)
  E_dot = (-E + (k_e - r_e * E) * S_E) / tau_E
  I_dot = (-I + (k_i - r_i * I) * S_I) / tau_I

  # Euler-Maruyama update with additive noise
  E += dt * E_dot + sqrt_dt * noise_E * sigma_E
  I += dt * I_dot + sqrt_dt * noise_I * sigma_I

conn_state_var: E
is_osc: false
bold_state_var: E

variables:
  # State variables
  - {name: E, type: state_var, description: excitatory population firing rate}
  - {name: I, type: state_var, description: inhibitory population firing rate}

  # Intermediate variables
  - {name: S_E,   type: intermediate_var, description: excitatory sigmoid activation}
  - {name: S_I,   type: intermediate_var, description: inhibitory sigmoid activation}
  - {name: E_dot, type: intermediate_var, description: derivative of E}
  - {name: I_dot, type: intermediate_var, description: derivative of I}

  # Global parameter (inferred g_e)
  - {name: G, type: global_param, description: global excitatory coupling (VBI g_e)}

  # Regional parameters (all VBI WC_FIXED knobs + inferred c_ei/g_i)
  - {name: c_ee,    type: regional_param, value: 11.0, description: E->E coupling}
  - {name: c_ei,    type: regional_param, value: 12.0, description: I->E inhibition (inferred)}
  - {name: c_ie,    type: regional_param, value: 10.0, description: E->I excitation}
  - {name: c_ii,    type: regional_param, value: 1.0,  description: I->I coupling}
  - {name: P_E,     type: regional_param, value: 0.5,  description: E external drive (VBI P)}
  - {name: P_I,     type: regional_param, value: 0.0,  description: I external drive (VBI Q)}
  - {name: sigma_E, type: regional_param, value: 0.02, description: E noise amplitude}
  - {name: sigma_I, type: regional_param, value: 0.02, description: I noise amplitude}
  - {name: g_i,     type: regional_param, value: 0.0,  description: FFI inhibitory gate (inferred)}
  - {name: lamda,   type: regional_param, value: 1.0,  description: FFI scale}
  - {name: alpha_E, type: regional_param, value: 1.2,  description: E sigmoid gain}
  - {name: alpha_I, type: regional_param, value: 2.0,  description: I sigmoid gain}
  - {name: theta_E, type: regional_param, value: 2.0,  description: E sigmoid threshold}
  - {name: theta_I, type: regional_param, value: 3.5,  description: I sigmoid threshold}
  - {name: k_e,     type: regional_param, value: 1.0,  description: E sigmoid max}
  - {name: k_i,     type: regional_param, value: 1.0,  description: I sigmoid max}
  - {name: r_e,     type: regional_param, value: 1.0,  description: E refractory}
  - {name: r_i,     type: regional_param, value: 1.0,  description: I refractory}
  - {name: c_e,     type: regional_param, value: 1.0,  description: E output scale}
  - {name: c_i,     type: regional_param, value: 1.0,  description: I output scale}
  - {name: tau_E,   type: regional_param, value: 10.0, description: E time constant (ms)}
  - {name: tau_I,   type: regional_param, value: 10.0, description: I time constant (ms)}

  # Noise channels
  - {name: noise_E, type: noise, description: noise for E}
  - {name: noise_I, type: noise, description: noise for I}

constants:
  - {type: double, name: dt,      value: dt,           description: integration step}
  - {type: double, name: sqrt_dt, value: sqrt(mc.dt),  description: square root of integration step}

python_config:
  sel_state_var: E
  labels:
    G: 'G'
    E: 'E'
    I: 'I'
    c_ee: '$c_{ee}$'
    c_ei: '$c_{ei}$'
    c_ie: '$c_{ie}$'
    c_ii: '$c_{ii}$'
    P_E: '$P_E$'
    P_I: '$P_I$'
    sigma_E: '$\sigma_E$'
    sigma_I: '$\sigma_I$'
    g_i: '$g_i$'
    lamda: '$\lambda$'
    alpha_E: '$\alpha_E$'
    alpha_I: '$\alpha_I$'
    theta_E: '$\theta_E$'
    theta_I: '$\theta_I$'
    tau_E: '$\tau_E$'
    tau_I: '$\tau_I$'
